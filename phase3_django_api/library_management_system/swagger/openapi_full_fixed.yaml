openapi: 3.0.0
info:
  title: Library Management API
  version: 1.0.0
  description: |
    API for managing libraries, books, authors, members, borrowings, and reviews.  
    Supports CRUD, search, filtering, and statistics.  
    No authentication required.

servers:
  - url: http://127.0.0.1:8000/api/v1/
  - url: http://localhost:8000/api/v1/

tags:
  - name: Libraries
  - name: Books
  - name: Authors
  - name: Members
  - name: Borrowings
  - name: Reviews
  - name: Statistics

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        status_code:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      example:
        success: false
        status_code: 400
        errors:
          field_name: ["This field is required."]

    Library:
      type: object
      properties:
        id: { type: integer }
        library_name: { type: string }
        campus_location: { type: string }
        contact_email: { type: string }
        phone_number: { type: string }

    Book:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        isbn: { type: string }
        publication_date: { type: string, format: date }
        library: { type: integer }
        author: { type: integer }
        category: { type: integer }

    Author:
      type: object
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        birth_date: { type: string, format: date }
        nationality: { type: string }

    Member:
      type: object
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        phone_number: { type: string }
        member_type:
          type: string
          enum: [student, faculty]

    Borrowing:
      type: object
      properties:
        id: { type: integer }
        member: { type: integer }
        book: { type: integer }
        borrow_date: { type: string, format: date }
        due_date: { type: string, format: date }
        late_fee: { type: number }

    Review:
      type: object
      properties:
        id: { type: integer }
        member: { type: integer }
        book: { type: integer }
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment: { type: string }
        review_date: { type: string, format: date }

paths:
  /libraries/:
    get:
      tags: [Libraries]
      summary: List all libraries
      responses:
        "200":
          description: List of libraries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Library" }
    post:
      tags: [Libraries]
      summary: Create a new library
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Library" }
      responses:
        "201": { description: Library created }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /libraries/{id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Libraries]
      summary: Retrieve a library
      responses:
        "200":
          description: Library details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "404": { description: Not found }
    put:
      tags: [Libraries]
      summary: Update library
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Library" }
      responses:
        "200": { description: Library updated }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { description: Not found }
    patch:
      tags: [Libraries]
      summary: Partially update library
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Library" }
      responses:
        "200": { description: Library updated }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { description: Not found }
    delete:
      tags: [Libraries]
      summary: Delete library
      responses:
        "204": { description: Library deleted }
        "404": { description: Not found }

  /books/:
    get:
      tags: [Books]
      summary: List books
      responses:
        "200":
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Book" }
    post:
      tags: [Books]
      summary: Create a new book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Book" }
      responses:
        "201": { description: Book created }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /books/{id}/:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Books]
      summary: Get book details
      responses:
        "200":
          description: Book details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "404": { description: Not found }
    put:
      tags: [Books]
      summary: Update book
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Book" }
      responses:
        "200": { description: Book updated }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { description: Not found }
    patch:
      tags: [Books]
      summary: Partially update book
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Book" }
      responses:
        "200": { description: Book updated }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { description: Not found }
    delete:
      tags: [Books]
      summary: Delete a book
      responses:
        "204": { description: Book deleted }
        "404": { description: Not found }

